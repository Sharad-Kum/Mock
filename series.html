<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter | Sharad Kumar</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261026-redesign">
<style>
  .blogs-segment { margin-bottom: 22px; }
  .blogs-segment:last-child { margin-bottom: 0; }
  .blogs-segment-title {
    font-size: var(--font-sm);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    line-height: 1;
    margin: 0 0 10px 2px;
  }
  /* The shared .blogs-grid-wrap rule (min-height:100%, flex-centered) was
     built for the old single-list page. Nested inside a stacked
     .blogs-segment here, that percentage height is ambiguous. Reset to
     plain block flow so every segment gets identical, predictable spacing. */
  .blogs-scroll .blogs-grid-wrap {
    min-height: 0;
    display: block;
  }
  .blogs-scroll .blogs-card { align-items: center; }
  .blogs-segment-title { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .blogs-segment-title .st { text-transform:none; letter-spacing:0.02em; color: var(--text-secondary); font-weight:500; }
  .nl-intro { text-align:center; margin:-4px auto 16px; max-width:60ch; font-size: var(--font-sm); color: var(--text-secondary-strong); }
  .nl-intro a { color: var(--clay); font-weight:600; text-decoration:none; margin-left:6px; }
  .nl-intro a:hover { text-decoration: underline; }
  .seg-note { margin:0 0 10px 2px; font-size: var(--font-xs); color: var(--text-secondary); }
  .blogs-card-meta { font-size: var(--font-xs); color: var(--text-secondary); white-space: nowrap; }
  .blogs-card-title small { display:block; margin-top:2px; font-size: var(--font-xs); color: var(--text-secondary); }
  .blogs-card.is-static:hover { border-color: var(--card-border); background: transparent; }
  .blogs-segment { scroll-margin-top: 8px; }
</style>
</head>
<body class="page-series">
<div class="blogs-frame">

<div class="letterhead">
    <div class="side-block"><img src="image.jpg" alt="Sharad Kumar" class="profile-pic"></div>
    <div class="header-center">
        <h1>SHARAD KUMAR</h1>
        <p class="tagline">Orchestrating Markets, Solutions &amp; Delivery</p>
    </div>
    <div class="side-block">
        <svg viewBox="0 0 120 120" width="80" height="80">
            <defs><path id="bottom-arc" d="M 15,60 A 45,45 0 0,0 105,60"/></defs>
            <image href="logo.png" x="20" y="15" width="80" height="80"/>
            <text font-size="12" style="fill:var(--clay);font-family:var(--font-body);" font-weight="700" letter-spacing="2">
                <textPath href="#bottom-arc">Addicted to Results</textPath>
            </text>
        </svg>
    </div>
</div>

<div class="blogs-headline"><h1 id="nlTitle">Newsletter</h1></div>
<p class="nl-intro" id="nlIntro"></p>
<div class="blogs-scroll" id="nlBody"></div>

<div class="connect-strip">
    <a href="index.html"><i class="fa-solid fa-house" style="color:var(--clay);"></i><span>Home</span></a>
    <a href="blogs.html"><i class="fa-solid fa-book-open" style="color:var(--clay);"></i><span>All Blogs</span></a>
    <a href="https://www.linkedin.com/in/sharad-kumar-11264247" target="_blank"><i class="fa-brands fa-linkedin" style="color:var(--linkedin-blue);"></i><span>LinkedIn</span></a>
    <a href="mailto:sharad.rsg@gmail.com?subject=Connect with Sharad"><i class="fa-solid fa-envelope" style="color:var(--clay);"></i><span>E-Mail</span></a>
    <a href="https://calendly.com/sharad-kumar-ms/strategic-connect" target="_blank"><i class="fa-solid fa-calendar-days" style="color:var(--clay);"></i><span>Schedule</span></a>
</div>

</div>
<script src="blog-data.js?v=0"></script>
<script>
const n = NEWSLETTERS.find(x => x.id === new URLSearchParams(location.search).get("s")) || NEWSLETTERS[0];
document.title = n.title + " | Sharad Kumar";
document.getElementById("nlTitle").textContent = n.title;
document.getElementById("nlIntro").innerHTML = esc(n.desc) + (n.linkedin ? `<a href="${esc(n.linkedin)}" target="_blank" rel="noopener">Subscribe on LinkedIn</a>` : "");
const card = e => {
  const inner = `<span class="blogs-card-num">${esc(e.no.replace("Edition ", "Ed "))}</span><span class="blogs-card-title">${esc(e.title)}${e.summary ? `<small>${esc(e.summary)}</small>` : ""}</span>${e.date ? `<span class="blogs-card-meta">${esc(e.date)}</span>` : ""}`;
  return e.url ? `<a class="blogs-card" href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="blogs-card is-static">${inner}</div>`;
};
document.getElementById("nlBody").innerHTML = n.sections.map(s => `
  <div class="blogs-segment" id="${esc(s.id)}">
    <h2 class="blogs-segment-title"><span>${esc(s.title)}</span><span class="st">${esc(s.status)}</span></h2>
    ${s.note ? `<p class="seg-note">${esc(s.note)}</p>` : ""}
    <div class="blogs-grid-wrap"><div class="blogs-grid">${(s.newestFirst ? [...s.editions].reverse() : s.editions).map(card).join("")}</div></div>
  </div>`).join("");
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
